name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: erilog
          POSTGRES_PASSWORD: erilog_dev
          POSTGRES_DB: erilog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erilog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://erilog:erilog_dev@localhost:5432/erilog
      ERILOG_SIGNING_PRIVATE_KEY: 9d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60

    steps:
      - uses: actions/checkout@v4

      # No `version` input: the pnpm version comes from the `packageManager`
      # field in package.json. Specifying both fails with a version mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The repo's `db:setup` goes through `docker compose exec`, which does not
      # apply to a service container. Apply the same schema file directly.
      - name: Apply database schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0001_schema.sql

      # Integration tests connect as app_role to prove UPDATE/DELETE are denied.
      # Login is a per-deployment concern, so the schema does not set it.
      - name: Provision app_role login for integration tests
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE app_role LOGIN PASSWORD 'app_pass';"

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Unit tests
        run: pnpm turbo test

      - name: Build
        run: pnpm turbo build

      - name: Headless demo
        run: pnpm demo:headless
