services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erilog
      POSTGRES_PASSWORD: erilog_dev
      POSTGRES_DB: erilog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erilog"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
